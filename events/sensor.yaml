apiVersion: argoproj.io/v1alpha1
kind: Sensor

metadata:
  name: demo-sensor
  namespace: argo-events

spec:
  template:
    serviceAccountName: argo-events-sa

  dependencies:
    - name: demo-dependency
      eventSourceName: demo-webhook
      eventName: demo

  triggers:
    - template:
        name: trigger-workflow
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow

              metadata:
                generateName: event-demo-
                namespace: argo

              spec:
                serviceAccountName: argo-workflow
                entrypoint: main

                templates:
                  - name: main
                    container:
                      image: alpine:3.20
                      command:
                        - sh
                        - -c
                      args:
                        - echo "Triggered by Argo Events"
