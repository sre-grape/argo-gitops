apiVersion: v1
kind: ServiceAccount

metadata:
  name: argo-events-sa
  namespace: argo-events

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: argo-events-workflow-creator
  namespace: argo

rules:
  - apiGroups:
      - argoproj.io
    resources:
      - workflows
    verbs:
      - create
      - get
      - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: argo-events-workflow-creator
  namespace: argo

subjects:
  - kind: ServiceAccount
    name: argo-events-sa
    namespace: argo-events

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-events-workflow-creator
